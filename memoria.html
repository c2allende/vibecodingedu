<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Memory Game</title>
    <style>
        :root {
            --bg: #fdf4ff;
            --primary: #a855f7;
            --secondary: #ec4899;
            --card-back: #6366f1;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        h1 { color: var(--primary); margin-bottom: 10px; font-size: 1.4rem; }

        .stats { margin-bottom: 10px; font-weight: bold; color: #475569; }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 350px;
            perspective: 1000px;
        }

        .card {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-weight: bold;
            font-size: 0.9rem;
        }

        .card-front {
            background: white;
            color: var(--text);
            transform: rotateY(180deg);
            border: 3px solid var(--primary);
        }

        .card-back {
            background: var(--card-back);
            color: white;
            font-size: 2rem;
        }

        .emoji { font-size: 2.5rem; margin-bottom: 5px; }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 360px) {
            .card { width: 85px; height: 85px; }
        }
    </style>
</head>
<body>

    <h1>🐾 Animal Memory</h1>
    <div class="stats">Intentos: <span id="moves">0</span> | Pares: <span id="matches">0</span>/6</div>
    
    <div class="grid" id="grid"></div>

    <button onclick="resetGame()">Reiniciar Juego</button>

    <script>
        const animals = [
            { name: 'LION', emoji: '🦁' }, { name: 'PANDA', emoji: '🐼' },
            { name: 'RABBIT', emoji: '🐰' }, { name: 'FROG', emoji: '🐸' },
            { name: 'PIG', emoji: '🐷' }, { name: 'MONKEY', emoji: '🐵' }
        ];

        let cards = [...animals, ...animals];
        let flippedCards = [];
        let matchedCount = 0;
        let moves = 0;
        let canFlip = true;

        function createBoard() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            cards.sort(() => Math.random() - 0.5);
            
            cards.forEach((animal, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.name = animal.name;
                card.innerHTML = `
                    <div class="card-face card-back">?</div>
                    <div class="card-face card-front">
                        <span class="emoji">${animal.emoji}</span>
                        <span>${animal.name}</span>
                    </div>
                `;
                card.onclick = () => flipCard(card);
                grid.appendChild(card);
            });
        }

        function flipCard(card) {
            if (!canFlip || card.classList.contains('flipped') || flippedCards.includes(card)) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').innerText = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            canFlip = false;
            const [card1, card2] = flippedCards;

            if (card1.dataset.name === card2.dataset.name) {
                matchedCount++;
                document.getElementById('matches').innerText = matchedCount;
                flippedCards = [];
                canFlip = true;
                if (matchedCount === 6) alert("¡Excelente! Completaste el vocabulario. 🎉");
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    canFlip = true;
                }, 1000);
            }
        }

        function resetGame() {
            moves = 0;
            matchedCount = 0;
            document.getElementById('moves').innerText = '0';
            document.getElementById('matches').innerText = '0';
            flippedCards = [];
            canFlip = true;
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
