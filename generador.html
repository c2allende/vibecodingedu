<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Comprensión Lectora</title>
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #ec4899;
            --bg: #f8fafc;
            --card: #ffffff;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: #1e293b;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h1 { color: var(--primary); font-size: 1.5rem; text-align: center; }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            resize: none;
            box-sizing: border-box;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        .quiz-area { margin-top: 30px; display: none; }

        .question-item {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .input-q {
            border: none;
            border-bottom: 2px solid var(--primary);
            background: transparent;
            padding: 2px 5px;
            font-size: 1rem;
            width: 120px;
            text-align: center;
        }

        .feedback {
            margin-top: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📝 Generador de Preguntas</h1>
        <div id="setup">
            <p>Pega un párrafo corto (3-5 oraciones) para generar el ejercicio:</p>
            <textarea id="sourceText" placeholder="Ej: Las plantas necesitan luz solar para crecer. El agua es vital para sus raíces..."></textarea>
            <button onclick="generateQuiz()">Generar Actividad</button>
        </div>

        <div id="quizArea" class="quiz-area">
            <h3>Completa las oraciones:</h3>
            <div id="questionsContainer"></div>
            <button onclick="checkAnswers()" style="background: var(--secondary);">Validar Respuestas</button>
            <button onclick="location.reload()" style="background: #64748b; margin-top: 10px;">Crear Nuevo</button>
        </div>
    </div>

    <script>
        let correctAnswers = [];

        function generateQuiz() {
            const text = document.getElementById('sourceText').value.trim();
            if (text.length < 20) return alert("Por favor, ingresa un texto más largo.");

            const sentences = text.split(/[.!?]/).filter(s => s.trim().length > 10).slice(0, 3);
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            correctAnswers = [];

            sentences.forEach((sentence, index) => {
                const words = sentence.trim().split(' ');
                // Selecciona una palabra larga (más de 5 letras) para ocultar
                const targetWordIndex = words.findIndex(w => w.length > 5);
                
                if (targetWordIndex !== -1) {
                    const originalWord = words[targetWordIndex].replace(/[,]/g, "");
                    correctAnswers.push(originalWord.toLowerCase());
                    
                    words[targetWordIndex] = `<input type="text" class="input-q" data-index="${index}">`;
                    
                    const div = document.createElement('div');
                    div.className = 'question-item';
                    div.innerHTML = `<p>${index + 1}. ${words.join(' ')}.</p><div class="feedback" id="fb-${index}"></div>`;
                    container.appendChild(div);
                }
            });

            document.getElementById('setup').style.display = 'none';
            document.getElementById('quizArea').style.display = 'block';
        }

        function checkAnswers() {
            const inputs = document.querySelectorAll('.input-q');
            inputs.forEach((input, index) => {
                const fb = document.getElementById(`fb-${index}`);
                fb.style.display = 'block';
                
                if (input.value.trim().toLowerCase() === correctAnswers[index]) {
                    fb.innerText = "✅ ¡Correcto!";
                    fb.style.color = "#16a34a";
                } else {
                    fb.innerText = `❌ Intenta de nuevo. (Pista: empieza con "${correctAnswers[index][0]}")`;
                    fb.style.color = "#dc2626";
                }
            });
        }
    </script>
</body>
</html>
